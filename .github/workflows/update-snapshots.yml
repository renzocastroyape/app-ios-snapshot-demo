name: Update Snapshots

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  SIMULATOR_OS: "27.0"
  REVIEWER: renzocastroyape

jobs:
  update-snapshots:
    # Only the designated reviewer can trigger it, by comment or by label.
    if: >-
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.body == '/update-snapshots'
        && github.event.comment.user.login == 'renzocastroyape')
      || (github.event_name == 'pull_request'
        && github.event.label.name == 'approve-snapshots'
        && github.event.sender.login == 'renzocastroyape')
    runs-on: xcode-27
    concurrency:
      group: update-snapshots-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - name: Resolve PR branch
        id: pr
        run: echo "branch=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}

      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: Tuist/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Tuist/Package.swift', 'Tuist/Package.resolved') }}
      - uses: ./.github/actions/setup-xcode
        with:
          ios-version: ${{ env.SIMULATOR_OS }}
      - run: make bootstrap

      - name: Record and verify snapshots
        run: make snapshots-record

      - name: Commit snapshots
        id: commit
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          git add -A -- '*__Snapshots__*'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --name-status -- '*__Snapshots__*' > build/snapshot-changes.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update snapshots (approved by ${REVIEWER})"
          git push origin "HEAD:${BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger workflows, so the checks are dispatched explicitly.
      - name: Re-run PR checks
        if: steps.commit.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: gh workflow run pr-checks.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: Comment summary
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            body="Snapshots updated and pushed to this branch (see the commit diff for the images):"$'\n\n```\n'"$(cat build/snapshot-changes.txt)"$'\n```'
          else
            body="Snapshots are already up to date; nothing to commit."
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Remove approval label
        if: github.event_name == 'pull_request'
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label approve-snapshots
